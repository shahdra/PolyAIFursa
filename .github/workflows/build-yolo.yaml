# Task 4 - Part III: Service containerization
#
# Same pattern as build-agent.yaml, for the yolo service: on every push that
# touches services/yolo/**, this builds a Docker image tagged with the
# commit SHA, pushes it to Docker Hub, then SSHes into the dev/prod server
# and runs `docker compose up -d yolo` to redeploy just that one container.
name: Build & Push Yolo

on:
  push:
    branches:
      - dev
      - main
    # Only fire when yolo's own code changes - this is what makes each
    # service independently buildable/deployable per the task requirement.
    paths:
      - "services/yolo/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push yolo image
        uses: docker/build-push-action@v6
        with:
          context: services/yolo
          push: true
          # Tag with the commit SHA so every build gets a unique, traceable
          # tag - never "latest", never reused across builds (see task notes).
          tags: shahdra/yolo-service:${{ github.sha }}

  # Deploys only the yolo service to the dev box - `docker compose up -d yolo`
  # recreates just that one container, leaving agent/frontend/img-proc-mcp/monitoring
  # untouched. Mirrors deploy.yaml's existing dev/prod SSH-branch split.
  deploy-dev:
    needs: build   # don't deploy an image that failed to build/push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy yolo to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          envs: YOLO_IMAGE_TAG
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            docker compose up -d yolo
            # Old container is already replaced above, so its image is now
            # unreferenced - safe to reclaim disk before it fills up.
            docker image prune -af
        env:
          YOLO_IMAGE_TAG: ${{ github.sha }}

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy yolo to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          envs: YOLO_IMAGE_TAG
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            docker compose up -d yolo
            docker image prune -af
        env:
          YOLO_IMAGE_TAG: ${{ github.sha }}
