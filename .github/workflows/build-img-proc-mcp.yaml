# Part IV (GitOps): builds and pushes the img-proc-mcp image on every change
# under services/img-proc-mcp/**, then commits the new image tag into the
# matching K8s manifest. ArgoCD watches the repo and rolls out the change - CI
# no longer touches the cluster directly (no SSH, no docker compose).
name: Build & Push Img Proc MCP

on:
  push:
    branches:
      - dev
      - main
    # Only fire when img-proc-mcp's own code changes - keeps each service
    # independently buildable/deployable per the task requirement.
    paths:
      - "services/img-proc-mcp/**"

# Needed by the commit-back job to push the manifest change with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push img-proc-mcp image
        uses: docker/build-push-action@v6
        with:
          context: services/img-proc-mcp
          push: true
          # Tag with the commit SHA so every build gets a unique, traceable
          # tag - never "latest", never reused across builds.
          tags: shahdra/img-proc-mcp-service:${{ github.sha }}

  # GitOps: bump the image tag in the correct env's manifest and commit it back.
  # ArgoCD (auto-sync for dev, manual for prod) picks up the commit and syncs.
  update-manifest:
    needs: build   # don't point the manifest at an image that failed to push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in manifest
        run: |
          ENV=$([ "${{ github.ref_name }}" = "main" ] && echo prod || echo dev)
          sed -i "s|image: shahdra/img-proc-mcp-service:.*|image: shahdra/img-proc-mcp-service:${{ github.sha }}|" \
            "infra/k8s/$ENV/img-proc-mcp/img-proc-mcp.yaml"

      - name: Commit and push
        run: |
          ENV=$([ "${{ github.ref_name }}" = "main" ] && echo prod || echo dev)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "infra/k8s/$ENV/img-proc-mcp/img-proc-mcp.yaml"
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git commit -m "ci: bump img-proc-mcp image to ${{ github.sha }} [skip ci]"
          # Push with rebase-retry: if another service's build pushed first,
          # rebase onto it and retry rather than failing on non-fast-forward.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push $attempt failed (likely concurrent push) - retrying"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push failed after 5 attempts" >&2; exit 1
