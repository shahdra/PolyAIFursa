# Part IV (GitOps): builds and pushes the img-proc-mcp image on every change
# under services/img-proc-mcp/**, then commits the new image tag into the dev
# manifest. ArgoCD watches the repo and rolls out the change - CI never touches
# the cluster directly (no SSH, no docker compose).
#
# Builds run only on dev. Prod is promoted by merging dev -> main: the same
# <sha> image tag rides along in the manifest, then you `argocd app sync
# img-proc-mcp-prod`. This keeps CI off the protected main branch entirely.
name: Build & Push Img Proc MCP

on:
  push:
    branches:
      - dev
    # Only fire when img-proc-mcp's own code changes - keeps each service
    # independently buildable/deployable per the task requirement.
    paths:
      - "services/img-proc-mcp/**"

# Dev pushes the manifest bump directly to the (unprotected) dev branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push img-proc-mcp image
        uses: docker/build-push-action@v6
        with:
          context: services/img-proc-mcp
          push: true
          # Tag with the commit SHA so every build gets a unique, traceable
          # tag - never "latest", never reused across builds.
          tags: shahdra/img-proc-mcp-service:${{ github.sha }}

  # GitOps: bump the image tag in the dev manifest and push it to the dev branch.
  update-manifest:
    needs: build   # don't point the manifest at an image that failed to push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update image tag in dev manifest
        run: |
          sed -i "s|image: shahdra/img-proc-mcp-service:.*|image: shahdra/img-proc-mcp-service:${{ github.sha }}|" \
            infra/k8s/dev/img-proc-mcp/img-proc-mcp.yaml

      - name: Commit and push to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/dev/img-proc-mcp/img-proc-mcp.yaml
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git commit -m "ci: bump img-proc-mcp image to ${{ github.sha }} [skip ci]"
          # Rebase-retry: another service's build may have pushed to dev first.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin dev
            if git push origin HEAD:dev; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push $attempt failed (likely concurrent push) - retrying"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push failed after 5 attempts" >&2; exit 1
