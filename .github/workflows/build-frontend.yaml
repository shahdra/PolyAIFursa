# Part IV (GitOps): builds and pushes the frontend image on every change under
# services/frontend/**, then commits the new image tag into the matching K8s
# manifest. ArgoCD watches the repo and rolls out the change - CI no longer
# touches the cluster directly (no SSH, no docker compose).
#
# Frontend is special among the services: NEXT_PUBLIC_AGENT_URL is baked into
# the client JS bundle at BUILD time (Next.js reads NEXT_PUBLIC_* only at build
# time), and dev/prod need a DIFFERENT baked-in URL (their own agent endpoint).
# So each env builds its own image tagged "<sha>-dev" / "<sha>-prod". A push is
# only ever on one branch, so exactly one env's build+commit-back runs.
name: Build & Push Frontend

# Serialize the manifest commit-back across the four build workflows so their
# concurrent `git push`es don't fail with non-fast-forward. One group per branch.
concurrency:
  group: manifest-commit-${{ github.ref }}

on:
  push:
    branches:
      - dev
      - main
    # Only fire when frontend's own code changes - keeps each service
    # independently buildable/deployable per the task requirement.
    paths:
      - "services/frontend/**"
  workflow_dispatch:

# Needed by the commit-back job to push the manifest change with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (dev)
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          # Bake in the dev instance's own agent URL at build time.
          build-args: |
            NEXT_PUBLIC_AGENT_URL=http://${{ secrets.DEV_INSTANCE_IP }}:8000
          # -dev suffix so this can never collide with a -prod build of the
          # same commit that bakes in a different URL.
          tags: shahdra/frontend-service:${{ github.sha }}-dev

  build-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (prod)
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          build-args: |
            NEXT_PUBLIC_AGENT_URL=http://${{ secrets.PROD_INSTANCE_IP }}:8000
          tags: shahdra/frontend-service:${{ github.sha }}-prod

  # GitOps: bump the env-suffixed image tag in the correct manifest and commit
  # it back. Only one of build-dev/build-prod runs per push (branch-gated), so
  # `needs` on both is fine - the skipped one is treated as satisfied.
  update-manifest:
    needs: [build-dev, build-prod]
    if: ${{ always() && (needs.build-dev.result == 'success' || needs.build-prod.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in manifest
        run: |
          ENV=$([ "${{ github.ref_name }}" = "main" ] && echo prod || echo dev)
          # Manifest tag carries the same -dev / -prod suffix as the built image.
          sed -i "s|image: shahdra/frontend-service:.*|image: shahdra/frontend-service:${{ github.sha }}-$ENV|" \
            "infra/k8s/$ENV/frontend/frontend.yaml"

      - name: Commit and push
        run: |
          ENV=$([ "${{ github.ref_name }}" = "main" ] && echo prod || echo dev)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "infra/k8s/$ENV/frontend/frontend.yaml"
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git commit -m "ci: bump frontend image to ${{ github.sha }}-$ENV [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
