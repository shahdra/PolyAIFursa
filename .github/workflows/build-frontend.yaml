# Part IV (GitOps): builds and pushes the frontend image on every change under
# services/frontend/**, then commits the new image tag into the dev manifest.
# ArgoCD watches the repo and rolls out the change - CI never touches the
# cluster directly (no SSH, no docker compose).
#
# One image for all environments: the agent URL is resolved at RUNTIME in the
# browser from window.location (see services/frontend/lib/api.ts), so there is
# no per-env build arg and no -dev/-prod tag split. Builds run only on dev;
# prod is promoted by merging dev -> main (the same <sha> tag rides along).
name: Build & Push Frontend

on:
  push:
    # dev only - main is promoted via merge, not built here.
    branches:
      - dev
    # Only fire when frontend's own code changes - keeps each service
    # independently buildable/deployable per the task requirement.
    paths:
      - "services/frontend/**"
  # Manual re-run (Actions tab -> Run workflow) to rebuild without a code change.
  workflow_dispatch:

# Dev pushes the manifest bump directly to the (unprotected) dev branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          # No NEXT_PUBLIC_AGENT_URL build-arg - the URL is derived at runtime.
          # One plain <sha> tag works in dev and prod alike.
          tags: shahdra/frontend-service:${{ github.sha }}

  # GitOps: bump the image tag in the dev manifest and push it to the dev branch.
  update-manifest:
    needs: build   # don't point the manifest at an image that failed to push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update image tag in dev manifest
        run: |
          sed -i "s|image: shahdra/frontend-service:.*|image: shahdra/frontend-service:${{ github.sha }}|" \
            infra/k8s/dev/frontend/frontend.yaml

      - name: Commit and push to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/dev/frontend/frontend.yaml
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git commit -m "ci: bump frontend image to ${{ github.sha }} [skip ci]"
          # Rebase-retry: another service's build may have pushed to dev first.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin dev
            if git push origin HEAD:dev; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push $attempt failed (likely concurrent push) - retrying"
            sleep $((RANDOM % 5 + 1))
          done
          echo "push failed after 5 attempts" >&2; exit 1
