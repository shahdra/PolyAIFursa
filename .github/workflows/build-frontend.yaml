# Task 4 - Part III: Service containerization
#
# Same pattern as build-agent.yaml, for the frontend: builds a Docker image
# on every push touching services/frontend/**, pushes it to Docker Hub, then
# redeploys just the frontend container on dev/prod via SSH.
#
# Frontend is special among the four services: NEXT_PUBLIC_AGENT_URL gets
# baked into the client-side JS bundle at build time (Next.js only reads
# NEXT_PUBLIC_* vars at build time, never at runtime), and dev/prod need a
# DIFFERENT baked-in URL (their own instance's agent endpoint). So unlike the
# other three services, this workflow builds two distinct images per push -
# one tagged "<sha>-dev", one "<sha>-prod" - rather than a single shared tag.
name: Build & Push Frontend

on:
  push:
    branches:
      - dev
      - main
    # Only fire when frontend's own code changes - this is what makes each
    # service independently buildable/deployable per the task requirement.
    paths:
      - "services/frontend/**"
  # Lets this be re-run on demand (Actions tab -> "Run workflow", or
  # `gh workflow run`) for redeploys that don't need a fresh image build.
  workflow_dispatch:

jobs:
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (dev)
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          # Bake in the dev instance's own agent URL at build time.
          # the frontend uses this to know wher to send requests, for the agent in the dev instance 
          build-args: |
            NEXT_PUBLIC_AGENT_URL=http://${{ secrets.DEV_INSTANCE_IP }}:8000 
          tags: shahdra/frontend-service:${{ github.sha }}-dev

  build-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image (prod)
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          # the frontend uses this to know wher to send requests, for the agent in the prod instance 
          build-args: |
            NEXT_PUBLIC_AGENT_URL=http://${{ secrets.PROD_INSTANCE_IP }}:8000
          tags: shahdra/frontend-service:${{ github.sha }}-prod

  # Deploys only the frontend service to the dev box - `docker compose up -d frontend`
  # recreates just that one container, leaving agent/yolo/img-proc-mcp/monitoring
  # untouched. Mirrors deploy.yaml's existing dev/prod SSH-branch split.
  deploy-dev:
    needs: build-dev   # don't deploy an image that failed to build/push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          envs: FRONTEND_IMAGE_TAG
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            docker compose up -d frontend
            # Old container is already replaced above, so its image is now
            # unreferenced - safe to reclaim disk before it fills up.
            docker image prune -af
        env:
          FRONTEND_IMAGE_TAG: ${{ github.sha }}-dev

  deploy-prod:
    needs: build-prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          envs: FRONTEND_IMAGE_TAG
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            docker compose up -d frontend
            docker image prune -af
        env:
          FRONTEND_IMAGE_TAG: ${{ github.sha }}-prod
