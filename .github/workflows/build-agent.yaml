# Part III (containerization): builds and pushes the agent service image on
# every change under services/agent/**. Runs independently of the other three
# build-*.yaml workflows so touching one service never rebuilds the others.
name: Build & Push Agent

on:
  push:
    branches:
      - dev
      - main
    # Only fire when agent's own code changes - this is what makes each
    # service independently buildable/deployable per the task requirement.
    paths:
      - "services/agent/**"
  # Lets this be re-run on demand (Actions tab -> "Run workflow", or
  # `gh workflow run`) for changes that don't touch services/agent/** but
  # still need a redeploy - e.g. compose-level env vars like ALLOWED_ORIGINS.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: services/agent
          push: true
          # Tag with the commit SHA so every build gets a unique, traceable
          # tag - never "latest", never reused across builds (see task notes).
          tags: shahdra/agent-service:${{ github.sha }}

  # Deploys only the agent service to the dev box - `docker compose up -d agent`
  # recreates just that one container, leaving yolo/frontend/img-proc-mcp/monitoring
  # untouched. Mirrors deploy.yaml's existing dev/prod SSH-branch split.
  deploy-dev:
    needs: build   # don't deploy an image that failed to build/push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy agent to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          # AGENT_IMAGE_TAG is read inline by docker-compose.yaml's
          # ${AGENT_IMAGE_TAG:-local} substitution on the remote host.
          envs: AGENT_IMAGE_TAG,ALLOWED_ORIGINS
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            # AGENT_IMAGE_TAG is compose-substitution config (goes in the
            # root .env, gitignored, survives git checkout) - it's read by
            # docker-compose.yaml's `image:` line, not by the container
            # itself. Upsert: drop any existing line, then append the current
            # one, so a later scoped deploy of a DIFFERENT service (or a bare
            # `docker compose up -d`) doesn't fall back to a stale tag.
            touch .env
            grep -v '^AGENT_IMAGE_TAG=' .env > .env.tmp || true
            echo "AGENT_IMAGE_TAG=$AGENT_IMAGE_TAG" >> .env.tmp
            mv .env.tmp .env
            # ALLOWED_ORIGINS is a real container env var for the agent, read
            # via env_file from services/agent/.env (not the root .env, which
            # only holds compose-substitution image tags now). Same upsert
            # pattern so it doesn't revert to localhost and break the
            # deployed frontend with CORS "Failed to fetch".
            touch services/agent/.env
            grep -v '^ALLOWED_ORIGINS=' services/agent/.env > services/agent/.env.tmp || true
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" >> services/agent/.env.tmp
            mv services/agent/.env.tmp services/agent/.env
            docker compose up -d agent
        env:
          AGENT_IMAGE_TAG: ${{ github.sha }}
          ALLOWED_ORIGINS: http://${{ secrets.DEV_INSTANCE_IP }}:3000

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy agent to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          envs: AGENT_IMAGE_TAG,ALLOWED_ORIGINS
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            # See deploy-dev above: image tag goes in the root .env (compose
            # substitution), ALLOWED_ORIGINS goes in services/agent/.env
            # (real container env var, loaded via env_file) - so neither goes
            # stale for other services' scoped deploys or a bare
            # `docker compose up -d`.
            touch .env
            grep -v '^AGENT_IMAGE_TAG=' .env > .env.tmp || true
            echo "AGENT_IMAGE_TAG=$AGENT_IMAGE_TAG" >> .env.tmp
            mv .env.tmp .env
            touch services/agent/.env
            grep -v '^ALLOWED_ORIGINS=' services/agent/.env > services/agent/.env.tmp || true
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" >> services/agent/.env.tmp
            mv services/agent/.env.tmp services/agent/.env
            docker compose up -d agent
        env:
          AGENT_IMAGE_TAG: ${{ github.sha }}
          ALLOWED_ORIGINS: http://${{ secrets.PROD_INSTANCE_IP }}:3000
