# Task 4 - Part III: Service containerization
#
# This workflow runs automatically every time code under services/agent/**
# is pushed. It does two things:
#   1. build:  packages the agent into a Docker image and uploads it to
#              Docker Hub, tagged with the commit's unique SHA (never
#              "latest" - so every image can be traced back to the exact
#              code it was built from).
#   2. deploy: connects to the dev or prod server over SSH and runs
#              `docker compose up -d agent`, which pulls that new image and
#              restarts only the agent container - yolo, frontend, and the
#              rest of the stack keep running untouched.
# Yolo, frontend, and img-proc-mcp each have their own matching workflow
# file, so changing one service only rebuilds/redeploys that one service.
name: Build & Push Agent

on:
  push:
    branches:
      - dev
      - main
    # Only fire when agent's own code changes - this is what makes each
    # service independently buildable/deployable per the task requirement.
    paths:
      - "services/agent/**"
  # Lets this be re-run on demand (Actions tab -> "Run workflow", or
  # `gh workflow run`) for changes that don't touch services/agent/** but
  # still need a redeploy - e.g. compose-level env vars like ALLOWED_ORIGINS.
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: services/agent # where the Dockerfile is located to know what to build the image from
          push: true
          # Tag with the commit SHA so every build gets a unique, traceable
          # tag - never "latest", never reused across builds (see task notes).
          tags: shahdra/agent-service:${{ github.sha }}

  # Deploys only the agent service to the dev box - `docker compose up -d agent`
  # recreates just that one container, leaving yolo/frontend/img-proc-mcp/monitoring
  # untouched. Mirrors deploy.yaml's existing dev/prod SSH-branch split.
  deploy-dev:
    needs: build   # don't deploy an image that failed to build/push
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy agent to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          envs: AGENT_IMAGE_TAG,ALLOWED_ORIGINS # exports these into the SSH session's shell for Compose to read
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            docker compose up -d agent
            # Old container is already replaced above, so its image is now
            # unreferenced - safe to reclaim disk before it fills up.
            docker image prune -af
        env:
          AGENT_IMAGE_TAG: ${{ github.sha }}
          ALLOWED_ORIGINS: http://${{ secrets.DEV_INSTANCE_IP }}:3000 # This is the URL that the frontend will use to call the agent API. It must match the ALLOWED_ORIGINS value in the agent container's environment so that CORS allows it.

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy agent to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          envs: AGENT_IMAGE_TAG,ALLOWED_ORIGINS # exports these into the SSH session's shell for Compose to read
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            docker compose up -d agent
            docker image prune -af
        env:
          AGENT_IMAGE_TAG: ${{ github.sha }}
          ALLOWED_ORIGINS: http://${{ secrets.PROD_INSTANCE_IP }}:3000
