name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt

      - name: Run tests
        run: pytest tests/
        working-directory: services/yolo

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: services/yolo/coverage.xml
          fail_ci_if_error: true

  scout-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # lets Scout post the CVE comment
    strategy:
      matrix:
        include:
          - service: agent
            context: services/agent
            dockerfile: services/agent/Dockerfile
            image_tag: local/agent:scout
          - service: yolo
            context: services/yolo
            dockerfile: services/yolo/Dockerfile
            image_tag: local/yolo:scout
          - service: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
            image_tag: local/frontend:scout
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }} image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image_tag }}

      - name: Scan ${{ matrix.service }} image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ matrix.image_tag }}
          only-severities: critical,high

  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: pip install -r services/agent/requirements.txt
      - name: Run agent tests
        run: pytest tests/
        working-directory: services/agent