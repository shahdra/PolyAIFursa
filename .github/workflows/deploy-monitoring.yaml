# Task 4 - Part II & III: Observability + containerization
#
# Prometheus, Grafana, and Node Exporter run off ready-made public Docker
# images (there's no source code to build for them, unlike the other four
# services) - all that ever changes is their config files (services/
# prometheus.yml, services/grafana/**). So instead of a build step, this
# workflow just pulls the latest code onto the dev/prod server and restarts
# those three containers so they pick up the new config.
name: Deploy Monitoring Stack

on:
  push:
    branches:
      - dev
      - main
    # Only fire when monitoring config changes - keeps this independent of
    # the per-service build workflows per the task requirement.
    paths:
      - "services/grafana/**"
      - "services/prometheus.yml"
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy monitoring stack to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            docker compose up -d prometheus grafana node-exporter

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy monitoring stack to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            docker compose up -d prometheus grafana node-exporter
