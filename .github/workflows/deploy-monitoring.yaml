# Part III (containerization): redeploys the monitoring stack whenever its
# config changes. Unlike the other build-*.yaml workflows, prometheus/grafana/
# node-exporter run off official upstream images (no Dockerfile to build) -
# this workflow only needs to ship the new config to the instance and restart
# those three containers so the bind-mounted files are picked up.
name: Deploy Monitoring Stack

on:
  push:
    branches:
      - dev
      - main
    # Only fire when monitoring config changes - keeps this independent of
    # the per-service build workflows per the task requirement.
    paths:
      - "services/grafana/**"
      - "services/prometheus.yml"
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy monitoring stack to Dev instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B dev origin/dev
            docker compose up -d prometheus grafana node-exporter

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy monitoring stack to Prod instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_INSTANCE_SSH_KEY }}
          script: |
            cd ~/PolyAIFursa
            git fetch origin
            git checkout -B main origin/main
            docker compose up -d prometheus grafana node-exporter
