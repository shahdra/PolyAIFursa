services:
  frontend:
    image: shahdra/frontend-service:${FRONTEND_IMAGE_TAG:-local}
    container_name: frontend
    # Makes the container come back up by itself if the EC2 instance reboots
    # or Docker restarts - without this, a reboot would leave it stopped.
    restart: unless-stopped
    ports:
      - "3000:3000"              # this forwards the container's port 3000 to the host machine so you can reach it in a browser
    depends_on:
      - agent
    networks:
      - polyai-net

  agent:
    image: shahdra/agent-service:${AGENT_IMAGE_TAG:-local}
    container_name: agent
    restart: unless-stopped
    ports:
      - "8000:8000"              # this forwards the container's port 8000 to the host machine so you can reach it in a browser
    env_file:
      - ./services/agent/.env
    environment:
      YOLO_SERVICE_URL: http://yolo:8080
      IMG_PROC_MCP_URL: http://img-proc-mcp:9000/mcp
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - yolo
      - img-proc-mcp
    networks:
      - polyai-net
    # other containers on polyai-net reach this one at agent:8000

  yolo:
    image: shahdra/yolo-service:${YOLO_IMAGE_TAG:-local}
    container_name: yolo
    restart: unless-stopped
    env_file:
      - ./services/yolo/.env
    networks:
      - polyai-net
    # other containers on polyai-net reach this one at yolo:8080

  # Task 4 - Part I: Image processing MCP server. This is the tool the agent
  # calls to actually edit images (blur, rotate, crop, add noise, ...). It
  # doesn't hold any images itself - it reads/writes them from the same S3
  # bucket the agent uses, identified by an S3 key, and never touches raw
  # image bytes over the network.
  img-proc-mcp:
    image: shahdra/img-proc-mcp-service:${IMG_PROC_IMAGE_TAG:-local}
    container_name: img-proc-mcp
    restart: unless-stopped
    env_file:
      - ./services/img-proc-mcp/.env
    networks:
      - polyai-net

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    command:
      # These flags point node-exporter at the *host machine's* system
      # folders (mounted below at /host/*) instead of the container's own -
      # otherwise it would report the container's tiny filesystem instead
      # of the real EC2 instance's disk/CPU/memory.
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      # Skip virtual/container filesystems so disk-usage numbers reflect
      # the actual host disks, not internal container mount points.
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      # Not exposed to the outside world - only Prometheus needs to reach
      # it, at node-exporter:9100, and both live on this same network.
      - monitoring-net

  # Prometheus is the metrics database. Every 15 seconds (see
  # services/prometheus.yml) it visits each service's /metrics endpoint,
  # reads the current numbers, and stores them with a timestamp so Grafana
  # can later draw graphs of how they changed over time.
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"              # Prometheus's own web UI, for browsing raw metrics
    volumes:
      - ./services/prometheus.yml:/etc/prometheus/prometheus.yml   # what to scrape and how often
      - prometheus-data:/prometheus                                # keeps history across restarts
    networks:
      - monitoring-net           # to reach node-exporter and grafana
      - polyai-net               # also joined here so it can reach yolo and agent's /metrics

  # Grafana turns Prometheus's raw numbers into dashboards/graphs you can
  # actually look at in a browser.
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"              # open this port in the browser for the Grafana UI (3000 was taken by frontend)
    volumes:
      # Persist Grafana's own data (users, dashboards, etc.) across restarts.
      - grafana-data:/var/lib/grafana
      # These two folders make Grafana configure itself automatically on
      # startup - it already knows about Prometheus and already has the
      # host-metrics dashboard loaded, no manual click-through needed.
      - ./services/grafana/provisioning:/etc/grafana/provisioning
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  polyai-net:
  monitoring-net: