global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'yolo-service'
    static_configs:
      - targets: ['yolo:8080']

  # Agent's FastAPI app now exposes /metrics via prometheus-fastapi-instrumentator
  # (see services/agent/app.py), reachable on polyai-net at agent:8000.
  - job_name: 'agent-service'
    static_configs:
      - targets: ['agent:8000']

  # Host-level metrics (CPU/mem/disk/net) served by the node-exporter
  # container on monitoring-net (see services/docker-compose.yaml).
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
