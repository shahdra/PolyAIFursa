# Task 4 - Part II: Observability
#
# Grafana reads this file on startup and loads every dashboard JSON file
# found in services/grafana/dashboards/ (the "Node Exporter Full" dashboard,
# ID 1860, giving host-level CPU/memory/disk/network graphs). No manual
# "import dashboard" step needed.
apiVersion: 1

providers:
  - name: PolyAI
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
