# Fluent Bit — ships Docker container logs to S3.
# Runs as a container in the EC2 Docker Compose deployment (NOT in k8s).
# The target bucket is per-environment via the LOGS_BUCKET env var:
#   dev  box (shahd-yolo-dev-server-3) -> shahd-polyai-logs-dev
#   prod box (shahd-yolo-prod-server)  -> shahd-polyai-logs-prod

[SERVICE]
    Flush         5
    Log_Level     info

[INPUT]
    Name          tail
    Tag           docker.*
    Path          /var/lib/docker/containers/*/*-json.log
    Parser        docker
    DB            /var/log/flb_docker.db
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On

[FILTER]
    Name          record_modifier
    Match         docker.*
    Record        host ${HOSTNAME}

[OUTPUT]
    Name              s3
    Match             *
    bucket            ${LOGS_BUCKET}
    region            us-east-1
    s3_key_format     /logs/%Y/%m/%d/$TAG[1]_%H%M%S.gz
    compression       gzip
    upload_timeout    60s
    use_put_object    On
    total_file_size   1M
