# Our OWN monitoring CRs for prod: ServiceMonitors (scrape the agent and yolo
# /metrics) and a PrometheusRule (the alerts). The kube-prometheus-stack chart
# itself is installed by infra/k8s/bootstrap.sh, not by ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shahdra/PolyAIFursa
    targetRevision: main
    path: infra/k8s/prod/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Prod sync is intentionally manual - review before promoting.
    syncOptions:
      - CreateNamespace=true
