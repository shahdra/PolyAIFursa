# Public routing for the PLATFORM services — the ones that are not part of a
# dev/prod environment: ArgoCD, Grafana, Prometheus and Alertmanager.
#
#   https://argocd.shahdra.fursa.click        -> argocd-server           (argocd)
#   https://grafana.shahdra.fursa.click       -> grafana                 (monitoring)
#   https://prometheus.shahdra.fursa.click    -> prometheus              (monitoring)
#   https://alertmanager.shahdra.fursa.click  -> alertmanager            (monitoring)
#
# Applied directly by infra/k8s/bootstrap.sh, NOT by ArgoCD. These route to the
# infrastructure that bootstrap itself installs (including ArgoCD's own UI), so
# making ArgoCD responsible for them would mean the front door to ArgoCD depends
# on ArgoCD already working — the exact circularity you do not want at 2am.
#
# As with the dev/prod Ingresses, there is no `tls:` block: the ALB terminates
# TLS with the ACM certificate and speaks plain HTTP to nginx.
---
# ── ArgoCD ─────────────────────────────────────────────────────────────────
# argocd-server normally serves HTTPS with a self-signed cert AND redirects
# HTTP to HTTPS. Behind a TLS-terminating proxy that produces a redirect loop:
# nginx forwards http://, argocd answers 307 to https://, the browser retries,
# the ALB terminates TLS again and forwards http:// once more.
#
# The fix is to run argocd-server in insecure (plain HTTP) mode, which
# bootstrap.sh does by setting `server.insecure: "true"` in the
# argocd-cmd-params-cm ConfigMap and restarting the deployment. The traffic is
# still encrypted end to end from the browser's point of view — TLS just ends at
# the ALB instead of at the pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # The `argocd` CLI and `kubectl port-forward`-free logins use gRPC; nginx
    # needs to know to speak HTTP/2 to that backend for `argocd login` to work
    # over the ingress.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.shahdra.fursa.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
---
# ── Grafana ────────────────────────────────────────────────────────────────
# Grafana has its own login, so no extra auth layer here. The admin password is
# in the `grafana-admin` Secret, created once by bootstrap.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.shahdra.fursa.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
---
# ── Prometheus ─────────────────────────────────────────────────────────────
# Prometheus ships with NO authentication whatsoever, and this hostname is on
# the public internet. Anyone who found it could read every metric in the
# cluster and, worse, hit /-/reload or the admin API. HTTP basic auth at the
# ingress is the cheapest real control; the `monitoring-basic-auth` Secret is
# generated by bootstrap.sh, which prints the password once.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus - PolyAI"
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.shahdra.fursa.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
---
# ── Alertmanager ───────────────────────────────────────────────────────────
# Same reasoning as Prometheus, and one step worse: an unauthenticated
# Alertmanager lets a stranger SILENCE your alerts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Alertmanager - PolyAI"
spec:
  ingressClassName: nginx
  rules:
    - host: alertmanager.shahdra.fursa.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-alertmanager
                port:
                  number: 9093
