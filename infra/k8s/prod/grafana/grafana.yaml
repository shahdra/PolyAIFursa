# Grafana (prod namespace): provisioning ConfigMaps (datasource + dashboard
# provider) + static EBS storage (PV/PVC) + Deployment + NodePort Service.
#
# The dashboard JSON files are large, so they are NOT inlined here — create that
# ConfigMap from the files at deploy time (see infra/k8s/DEPLOY.md):
#   kubectl -n dev create configmap grafana-dashboards \
#     --from-file=services/grafana/dashboards/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: prod
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: prod
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: PolyAI
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# No static PersistentVolume here on purpose.
#
# This used to be a PV with a hardcoded `volumeHandle: vol-...` naming an EBS
# volume from the old hand-built cluster. That breaks in two ways:
#   1. An EBS volume lives in ONE availability zone. Workers are spread across
#      two AZs by the ASG, so whenever the pod landed in the other AZ the attach
#      failed with `InvalidVolume.ZoneMismatch` and the pod hung in
#      ContainerCreating forever.
#   2. A hardcoded volume ID cannot survive `terraform destroy` + recreate, which
#      is exactly what task006's acceptance test does.
#
# The PVC below now provisions dynamically through the `ebs-sc` StorageClass,
# whose volumeBindingMode is WaitForFirstConsumer: the volume is created only
# once the pod is scheduled, in that pod's own AZ. Correct in any region.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 2Gi
  # No volumeName: that would pin this claim to a specific pre-existing PV.
  # Omitting it lets ebs-sc provision a fresh volume in the pod's AZ.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: prod
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472        # grafana runs as uid/gid 472; make the volume writable
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards      # created from files at deploy time
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: prod
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31301     # prod grafana — open http://<node-ip>:31301
