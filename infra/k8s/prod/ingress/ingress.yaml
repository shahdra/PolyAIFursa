# Public routing for the PROD environment.
#
#   https://shahdra.fursa.click/       -> frontend-service:3000
#   https://shahdra.fursa.click/chat   -> agent-service:8000
#
# Identical in shape to infra/k8s/dev/ingress/ingress.yaml, differing only in
# the namespace and the hostname (prod sits at the domain root, dev on the `dev`
# label). See that file for why frontend and agent share a host and why there is
# no `tls:` block.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polyai
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: shahdra.fursa.click
      http:
        paths:
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
