# Prometheus (prod namespace): ConfigMap (scrape config) + static EBS storage
# (PV/PVC) + Deployment + Service. node-exporter is intentionally dropped
# (excluded from the k8s migration per task5.md). Scrape targets use in-cluster
# Service DNS names instead of the compose hostnames.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prod
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'yolo-service'
        static_configs:
          - targets: ['yolo-service:8080']

      - job_name: 'agent-service'
        static_configs:
          - targets: ['agent-service:8000']
---
# No static PersistentVolume here on purpose.
#
# This used to be a PV with a hardcoded `volumeHandle: vol-...` naming an EBS
# volume from the old hand-built cluster. That breaks in two ways:
#   1. An EBS volume lives in ONE availability zone. Workers are spread across
#      two AZs by the ASG, so whenever the pod landed in the other AZ the attach
#      failed with `InvalidVolume.ZoneMismatch` and the pod hung in
#      ContainerCreating forever.
#   2. A hardcoded volume ID cannot survive `terraform destroy` + recreate, which
#      is exactly what task006's acceptance test does.
#
# The PVC below now provisions dynamically through the `ebs-sc` StorageClass,
# whose volumeBindingMode is WaitForFirstConsumer: the volume is created only
# once the pod is scheduled, in that pod's own AZ. Correct in any region.
# (The old claimRef that isolated dev from prod is no longer needed - a
# dynamically provisioned volume is bound to exactly one PVC by construction.)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 5Gi
  # No volumeName: that would pin this claim to a specific pre-existing PV.
  # Omitting it lets ebs-sc provision a fresh volume in the pod's AZ.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: prod
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        fsGroup: 65534   # prometheus runs as nobody(65534); make the volume writable
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: prod
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
