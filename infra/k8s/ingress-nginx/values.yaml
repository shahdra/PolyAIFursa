# Helm values for ingress-nginx — the in-cluster half of the front door.
#
# Installed by infra/k8s/bootstrap.sh:
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     -n ingress-nginx --create-namespace -f infra/k8s/ingress-nginx/values.yaml
#
# The AWS half (ALB, target group, ACM, Route 53) is infra/tf/modules/ingress.
# The ONE value that couples them is the HTTP node port: the Terraform target
# group forwards to 30080, so this file must pin 30080. Change one, change both
# in the same commit.

controller:
  # NodePort, not LoadBalancer. A LoadBalancer Service in a kubeadm cluster with
  # no AWS cloud-controller-manager stays <pending> forever — nothing exists to
  # provision the ELB. The ALB is provisioned by Terraform instead, and reaches
  # the controller through a fixed node port.
  service:
    type: NodePort
    nodePorts:
      # PINNED. Kubernetes would otherwise allocate a random port in
      # 30000-32767, and Terraform has to know it before this chart is ever
      # installed.
      http: 30080
      https: 30443

  # The ALB terminates TLS and forwards plain HTTP. Without these, every app
  # behind the proxy sees the ALB's private IP as the client and believes the
  # request arrived over http:// — which breaks redirect URLs and any log that
  # records a client address.
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
    # Trust X-Forwarded-* only from inside the VPC, i.e. from the ALB. Left
    # open, any client could spoof its own source IP in a header.
    proxy-real-ip-cidr: "10.0.0.0/16"
    # Uploaded images travel through here (the frontend posts base64 payloads to
    # the agent); nginx's 1m default truncates them into 413s.
    proxy-body-size: "16m"
    # The agent calls an LLM and can take a while to answer.
    proxy-read-timeout: "120"
    proxy-send-timeout: "120"

  # One controller pod per node. A DaemonSet would also work; with a 1-3 node
  # ASG a Deployment plus this anti-affinity spreads replicas without pinning
  # the count to the node count.
  replicaCount: 1

  # Prometheus metrics. "You only need to enable them" — this is that switch,
  # plus the ServiceMonitor that makes kube-prometheus-stack scrape them, which
  # is what feeds Grafana dashboard 9614.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      # The kube-prometheus-stack release adds this label to everything it owns
      # and (by default) only selects ServiceMonitors carrying it. Our values
      # also set serviceMonitorSelectorNilUsesHelmValues=false, so this is
      # belt-and-braces — but it keeps the ServiceMonitor selectable either way.
      additionalLabels:
        release: kube-prometheus-stack

  # An IngressClass named "nginx", marked default so an Ingress without
  # spec.ingressClassName is still picked up.
  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  # Modest requests: a t3.medium worker also runs the whole PolyAI stack and
  # kube-prometheus-stack. No CPU limit on purpose — throttling the ingress
  # controller degrades every service behind it at once.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  admissionWebhooks:
    # Validates Ingress manifests at admission time and rejects ones that would
    # produce a broken nginx.conf. Worth keeping: ArgoCD applies these, and a
    # bad annotation failing at `kubectl apply` is far easier to debug than a
    # controller that silently refuses to reload.
    enabled: true
